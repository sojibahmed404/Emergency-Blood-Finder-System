# ─────────────────────────────────────────────────────────
# Emergency Blood Finder System v2.1 — Backend Configuration
# ─────────────────────────────────────────────────────────

# Server
server.port=8080

# ── Database ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/blood_finder_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ── JWT ───────────────────────────────────────────────────
# IMPORTANT: Change this secret before deploying to production!
app.jwt.secret=EmergencyBloodFinderSuperSecretKeyForJWT2024!ChangeInProd
app.jwt.expiration-ms=86400000

# ── CORS ──────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# ── Logging ───────────────────────────────────────────────
logging.level.com.bloodfinder=DEBUG
logging.level.org.springframework.security=WARN
