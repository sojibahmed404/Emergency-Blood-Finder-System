version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: bloodfinder-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: blood_finder_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: bloodfinder
      MYSQL_PASSWORD: bloodfinder
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: bloodfinder-backend
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/blood_finder_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: bloodfinder
      DB_PASS: bloodfinder
      JWT_SECRET: ReplaceThisSecretInProd
      FRONTEND_URL: http://localhost:5173
    restart: unless-stopped

volumes:
  db_data:
